<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三上地科互動課本</title>
<style>
  :root { --primary: #24584A; --bg: #F4F1EA; --ink: #23302B; --muted: #66736E; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; line-height: 1.6; }
  header { background: var(--primary); color: #fff; padding: 28px 16px; text-align: center; }
  header h1 { margin: 0 0 4px; font-size: 1.7rem; }
  header p { margin: 0; opacity: .85; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
  a.card { display: block; background: #fff; border-radius: 14px; padding: 22px; text-decoration: none; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.1); border-top: 6px solid var(--c); transition: transform .15s; }
  a.card:hover { transform: translateY(-3px); }
  .em { font-size: 2.4rem; }
  .ch { color: var(--c); font-weight: bold; font-size: .9rem; }
  h2 { margin: 2px 0 8px; font-size: 1.35rem; }
  .card p { margin: 0; color: var(--muted); font-size: .92rem; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding-bottom: 30px; }
</style>
</head>
<body>
<header>
  <h1>🌏 三上地科互動課本</h1>
  <p>國中自然 3 上｜第五～七章｜互動模擬＋真實案例＋迷思擂台</p>
</header>
<main>
  <a class="card" href="ch5.html" style="--c:#2E7D32">
    <div class="em">🏞</div><div class="ch">第五章</div><h2>地球的環境</h2>
    <p>水的分布、地下水與地層下陷、水循環、河流與外營力、海岸線、岩石與礦物</p>
  </a>
  <a class="card" href="ch6.html" style="--c:#C62828">
    <div class="em">🌋</div><div class="ch">第六章</div><h2>板塊運動與岩層的祕密</h2>
    <p>地球分層、板塊交界、褶皺與斷層、地震與預警、臺灣的板塊、岩層與化石</p>
  </a>
  <a class="card" href="ch7.html" style="--c:#3949AB">
    <div class="em">🌌</div><div class="ch">第七章</div><h2>浩瀚的宇宙</h2>
    <p>宇宙層級與光年、太陽系、晝夜與四季、月相、日食與月食、潮汐</p>
  </a>
</main>
<footer>右上角可切換「一般班／資優班」與「投影模式」｜鍵盤 ← → 換分頁</footer>
</body>
</html>
